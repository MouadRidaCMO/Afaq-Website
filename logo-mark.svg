<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AFAQ">
  <defs>
    <linearGradient id="capTop" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#2b6bcb"/>
      <stop offset="55%" stop-color="#1a52a8"/>
      <stop offset="100%" stop-color="#0f3d84"/>
    </linearGradient>
    <linearGradient id="capBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d58b2"/>
      <stop offset="100%" stop-color="#0b3070"/>
    </linearGradient>
    <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4dc9a"/>
      <stop offset="40%" stop-color="#d9b155"/>
      <stop offset="100%" stop-color="#a87f24"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8912f"/>
      <stop offset="30%" stop-color="#f2d992"/>
      <stop offset="60%" stop-color="#d4ab4a"/>
      <stop offset="100%" stop-color="#a87f24"/>
    </linearGradient>
  </defs>

  <!-- cap body -->
  <path d="M128 232 L142 302 Q256 344 370 296 L384 228 Z" fill="url(#capBody)"/>
  <path d="M142 302 Q256 344 370 296" fill="none" stroke="url(#goldB)" stroke-width="9" stroke-linecap="round"/>
  <path d="M170 250 L182 318" fill="none" stroke="url(#goldB)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M342 246 L332 314" fill="none" stroke="url(#goldB)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

  <!-- mortarboard -->
  <path d="M272 100 L486 186 L240 268 L26 182 Z" fill="url(#capTop)"
        stroke="url(#goldB)" stroke-width="11" stroke-linejoin="round"/>

  <!-- button -->
  <ellipse cx="252" cy="184" rx="23" ry="14" fill="url(#goldA)"/>

  <!-- cord -->
  <path d="M252 184 Q196 200 168 232 Q156 246 154 258" fill="none"
        stroke="url(#goldB)" stroke-width="10" stroke-linecap="round"/>

  <!-- tassel -->
  <ellipse cx="152" cy="270" rx="19" ry="15" fill="url(#goldA)"/>
  <path d="M131 280 Q152 272 173 280 L182 386 Q152 408 122 386 Z" fill="url(#goldA)"/>
  <g stroke="#a87f24" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M143 286 L138 392"/>
    <path d="M152 287 L152 396"/>
    <path d="M161 286 L167 392"/>
  </g>
</svg>
